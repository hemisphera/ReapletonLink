name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  MAJOR_VERSION: 0
  MINOR_VERSION: 0

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: reaper_ReapletonLink.dll
          - os: macos-latest
            artifact: reaper_ReapletonLink.dylib
          - os: ubuntu-latest
            artifact: reaper_ReapletonLink.so

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -A x64

      - name: Configure CMake (macOS)
        if: runner.os == 'macOS'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Configure CMake (Linux)
        if: runner.os == 'Linux'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReapletonLink-${{ runner.os }}
          path: |
            build/Release/${{ matrix.artifact }}
            build/${{ matrix.artifact }}

  release:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: ReapletonLink-*

      - name: Get build number
        id: version
        env:
          COUNTER_API_KEY: ${{ secrets.COUNTER_API_KEY }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          response=$(curl -fsS -X POST \
            "https://counters.hemisphera.com/counters/github/${REPO_NAME}_${MAJOR_VERSION}_${MINOR_VERSION}" \
            -H "X-API-Key: ${COUNTER_API_KEY}" \
            -H 'Content-Type: application/json' \
            -d '{"signature": "'"${GITHUB_SHA}"'", "seed": 1, "increment": 1}')
          echo "build_number=$(echo "$response" | jq -r '.value.value')" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.MAJOR_VERSION }}.${{ env.MINOR_VERSION }}.${{ steps.version.outputs.build_number }}
          name: v${{ env.MAJOR_VERSION }}.${{ env.MINOR_VERSION }}.${{ steps.version.outputs.build_number }}
          files: dist/**/reaper_ReapletonLink.*
          generate_release_notes: true